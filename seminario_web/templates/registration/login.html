{% extends 'base.html' %}

{% block titulo %}Ingresar | AnimeWeb{% endblock %}

{% block contenido %}

<section class="form-page">

    <div class="form-card">

        <h1>Ingresar</h1>

        <form
            class="formulario"
            method="post"
        >

            {% csrf_token %}

            {{ form.as_p }}

            <button
                class="btn btn-principal"
                type="submit"
            >
                Entrar
            </button>

        </form>


        <p>
            ¿No tenés cuenta?
            <a href="{% url 'registro' %}">
                Registrate acá
            </a>
        </p>

    </div>

</section>

{% endblock %}
